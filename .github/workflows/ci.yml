name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: server

        steps:
            - name: Checkout du code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: server/package-lock.json

            - name: Installer les dépendances
              run: npm i

            - name: Lancer les tests
              run: npm test
              env:
                  JWT_SECRET: ${{ secrets.JWT_SECRET }}

            - name: Vérifier que le projet build (Docker)
              run: docker build -t olivetrack-backend .

    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: client

        steps:
            - name: Checkout du code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: client/package-lock.json

            - name: Installer les dépendances
              run: npm ci

            - name: Lint automatique (ESLint)
              run: npm run lint

            - name: Build automatique
              run: npm run build
