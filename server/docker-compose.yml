version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: skillbridge-db
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=skillbridge
    volumes:
      - mongo-data:/data/db

  server:
    build: .
    container_name: skillbridge-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/skillbridge
      - JWT_SECRET=your_jwt_secret_key_here
    depends_on:
      - mongo

volumes:
  mongo-data: